<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>cargando</title>
<link rel="stylesheet" href="../../web/css/tokens.css">
<link rel="stylesheet" href="../../web/css/base.css">
<link rel="stylesheet" href="../../web/css/app.css">
</head>
<body>
<div class="card oculto" id="tarjetaPropuestas" data-panel="actividades"></div>
<div class="card" id="bloquePropuestasContratista"></div>
<script>
window.__llamadas = [];
const PROPUESTA = {
  id: 'P1', titulo: 'Cambio de empaque', nodo_id: 'N1', nodo_codigo: 'CA-AC', nodo_nombre: 'Áreas comunes',
  hallazgo: 'El empaque del domo está partido y entra agua', alcance: 'Cambiar el empaque y sellar',
  fecha_inicio_sugerida: '2026-11-20', fecha_fin_sugerida: '2026-11-21', prioridad_sugerida: 'MEDIA',
  estado: 'PENDIENTE', fotos: [], propuesta_por: 'U1', propuesta_por_nombre: 'Luis',
  valor_cotizado: 1250000, cotizacion_vigente_hasta: '2026-12-30',
  cotizacion: { nombre: 'cotizacion.pdf', bytes: 840000 },
};
window.API = { llamar: function (accion, payload) {
  window.__llamadas.push({ accion: accion, payload: payload });
  if (accion === 'propuestas.listar') return Promise.resolve({ ok: true, data: { propuestas: [PROPUESTA] } });
  if (accion === 'propuestas.get') return Promise.resolve({ ok: true, data: {
    propuesta: PROPUESTA, version: 'v1',
    permisos: { editar: window.__rol === 'ADMIN' || window.__rol === 'CONTRATISTA',
      decidir: window.__rol === 'ADMIN', eliminar: window.__rol === 'ADMIN' },
    secciones_posibles: [{ id: 'N1', codigo: 'CA-AC', nombre: 'Áreas comunes' }],
    verificacion: { usuario_activo: true, asignacion_vigente: true, empresa_vencida: false },
  } });
  if (accion === 'empresas.listar') return Promise.resolve({ ok: true, data: { empresas: [] } });
  if (accion === 'usuarios.listar') return Promise.resolve({ ok: true, data: { usuarios: [] } });
  if (accion === 'nodos.arbol') return Promise.resolve({ ok: true, data: { nodos: [
    { id: 'N1', codigo: 'CA-AC', nombre: 'Áreas comunes' } ] } });
  if (accion === 'propuestas.eliminar') return Promise.resolve({ ok: true, data: { eliminada: true } });
  return Promise.resolve({ ok: true, data: {} });
} };
window.Sesion = { token: function () { return 'x'; } };
window.Datos = { obtener: function (a) { return window.API.llamar(a); }, invalidar: function () {} };

</script>
<script src="../../web/js/fotos.js"></script>
<script src="../../web/js/propuestas.js"></script>
<script>
(async function () {
  const r = [];
  function esperar(ms) { return new Promise(function (x) { setTimeout(x, ms); }); }
  function texto(sel) { const n = document.querySelector(sel); return n ? n.textContent : ''; }
  function botones() {
    return Array.prototype.slice.call(document.querySelectorAll('button')).map(function (b) { return b.textContent; });
  }

  try {
    // Administrador: puede decidir, guardar y eliminar
    window.__rol = 'ADMIN';
    await Propuestas.cargar('ADMIN', [{ id: 'N1', codigo: 'CA-AC', nombre: 'Áreas comunes' }]);
    await esperar(300);
    const fila = document.querySelector('#tarjetaPropuestas .fila-propuesta');
    r.push((fila ? 'OK   ' : 'FALLA') + ' · el administrador ve la propuesta pendiente');
    fila.click();
    await esperar(350);
    const b = botones();
    r.push((b.indexOf('Aprobar y crear la actividad') >= 0 ? 'OK   ' : 'FALLA') + ' · ve «Aprobar»');
    r.push((b.indexOf('Eliminar') >= 0 ? 'OK   ' : 'FALLA') + ' · ve «Eliminar»');
    r.push((texto('body').indexOf('Ver PDF') >= 0 ? 'OK   ' : 'FALLA') + ' · y puede abrir el PDF');

    // Eliminar pide doble confirmación y motivo
    const eliminar = Array.prototype.slice.call(document.querySelectorAll('button'))
      .filter(function (x) { return x.textContent === 'Eliminar'; })[0];
    eliminar.click();
    await esperar(100);
    r.push((eliminar.textContent.indexOf('Confirmar') >= 0 ? 'OK   ' : 'FALLA') +
      ' · el primer clic solo arma la confirmación');
    r.push((window.__llamadas.filter(function (x) { return x.accion === 'propuestas.eliminar'; }).length === 0
      ? 'OK   ' : 'FALLA') + ' · y no elimina todavía');

    window.prompt = function () { return 'Se creó dos veces por error'; };
    eliminar.click();
    await esperar(300);
    const llamada = window.__llamadas.filter(function (x) { return x.accion === 'propuestas.eliminar'; })[0];
    r.push((llamada ? 'OK   ' : 'FALLA') + ' · al confirmar elimina');
    r.push((llamada && llamada.payload.version === 'v1' ? 'OK   ' : 'FALLA') + ' · enviando la versión');

    // Supervisor: no decide ni elimina
    window.__rol = 'SUPERVISOR';
    document.getElementById('tarjetaPropuestas').textContent = '';
    await Propuestas.cargar('SUPERVISOR', [{ id: 'N1', codigo: 'CA-AC', nombre: 'Áreas comunes' }]);
    await esperar(300);
    document.querySelector('#tarjetaPropuestas .fila-propuesta').click();
    await esperar(350);
    const bs = botones();
    r.push((bs.indexOf('Aprobar y crear la actividad') < 0 ? 'OK   ' : 'FALLA') + ' · el supervisor no ve «Aprobar»');
    r.push((bs.indexOf('Eliminar') < 0 ? 'OK   ' : 'FALLA') + ' · ni «Eliminar»');

    // Contratista: ve su PDF
    window.__rol = 'CONTRATISTA';
    document.getElementById('bloquePropuestasContratista').textContent = '';
    await Propuestas.cargar('CONTRATISTA', [{ id: 'N1', codigo: 'CA-AC', nombre: 'Áreas comunes' }]);
    await esperar(300);
    r.push((texto('#bloquePropuestasContratista').indexOf('Ver PDF') >= 0 || botones().indexOf('Ver PDF') >= 0
      ? 'OK   ' : 'FALLA') + ' · el contratista puede abrir su PDF');
    r.push((botones().indexOf('Corregir') >= 0 ? 'OK   ' : 'FALLA') + ' · y puede corregirla');

    // Al corregir, el formulario llega con lo que ya tenía y guarda con la versión
    const corregir = Array.prototype.slice.call(document.querySelectorAll('button'))
      .filter(function (b) { return b.textContent === 'Corregir'; })[0];
    corregir.click();
    await esperar(350);
    r.push((document.getElementById('prTitulo') ? 'OK   ' : 'FALLA') + ' · abre el formulario');
    r.push((document.getElementById('prTitulo').value === 'Cambio de empaque' ? 'OK   ' : 'FALLA') +
      ' · con el título que tenía');
    r.push((document.getElementById('prValor').value.indexOf('1.250.000') >= 0 ? 'OK   ' : 'FALLA') +
      ' · y su valor');

    window.__llamadas = [];
    const guardar = Array.prototype.slice.call(document.querySelectorAll('button'))
      .filter(function (b) { return b.textContent === 'Guardar cambios'; })[0];
    r.push((guardar ? 'OK   ' : 'FALLA') + ' · ofrece «Guardar cambios»');
    if (guardar) {
      guardar.click();
      await esperar(400);
      const ed = window.__llamadas.filter(function (x) { return x.accion === 'propuestas.editar'; })[0];
      r.push((ed ? 'OK   ' : 'FALLA') + ' · guarda con propuestas.editar');
      r.push((ed && ed.payload.version === 'v1' ? 'OK   ' : 'FALLA') + ' · con la versión de la propuesta');
    }
  } catch (e) { r.push('FALLA · ' + e.message); }
  document.title = r.join(' | ');
})();
</script>
</body></html>
