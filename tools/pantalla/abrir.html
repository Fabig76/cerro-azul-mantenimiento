<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>cargando</title></head>
<body>
<div id="vistaActividad" hidden></div>
<div id="tarjetaActividades"></div>
<div id="contenidoActividad"></div>
<div class="msg" id="avisoActividad"></div>
<script>
// Abre el detalle POR EL CAMINO REAL (Actividad.abrir), no con un atajo.
window.Sesion = { token: function () { return 'x'; }, usuario: function () { return { id: 'U1' }; } };
window.__estado = 'PROGRAMADA';
window.__err = [];
window.addEventListener('error', function (e) { window.__err.push('error: ' + e.message); });
window.addEventListener('unhandledrejection', function (e) {
  window.__err.push('promesa: ' + ((e.reason && e.reason.message) || e.reason));
});
window.__llamadas = [];
window.API = { llamar: function (accion, payload) {
  window.__llamadas.push({ accion: accion, payload: payload || {} });
  if (accion === 'reportes.crear') return Promise.resolve({ ok: true, data: { reporte_id: 'REP_1' } });
  if (accion !== 'actividades.get') return Promise.resolve({ ok: true, data: {} });
  var estado = window.__estado;
  return Promise.resolve({ ok: true, data: {
    actividad: { id: 'ACT_1', titulo: 'Fumigación', estado: estado, nodo_id: 'NOD_1',
      fecha_inicio_plan: '2026-11-15', fecha_fin_plan: '2026-11-17', prioridad: 'MEDIA',
      avance_aprobado_pct: 0, afecta_uso: false, obligatoria_legal: false,
      empresa_id: 'EMP_1', responsable_id: 'USU_1' },
    descripcion: 'Fumigación general',
    nodo: { id: 'NOD_1', codigo: 'CA-T1', nombre: 'Torre 1', sensible: false },
    plantilla: { id: 'P', nombre: 'X', metodo_avance: 'CHECKLIST', items: [
      { id: 'I1', orden: 1, grupo: 'G', pregunta: '¿Quedó limpio?', tipo_respuesta: 'SI_NO',
        obligatorio: true, peso: 1, requiere_foto: false, criterio: '' } ] },
    hitos: window.__conHitos
      ? [{ id: 'HIT_1', orden: 1, nombre: 'FUMIGACION', peso: 1, fecha_plan: '2026-11-13', estado: 'PENDIENTE' }]
      : [],
    reportes: [], evidencias: [], respuestas: [],
    ultimo_final: estado === 'RECHAZADA'
      ? { comentario_admin: 'Falta la foto', revisado_en: '2026-11-12T09:00:00-05:00' } : null,
    propuesta: null,
  } });
} };
window.Fotos = { preparar: function () { return Promise.resolve({}); } };
window.App = { pestana: function () {}, refrescar: function () {} };
</script>
<script src="../../web/js/fotocache.js"></script>
<script src="../../web/js/etapas.js"></script>
<script src="../../web/js/actividad.js"></script>
<script>
(async function () {
  const r = [];
  function esperar(ms) { return new Promise(function (x) { setTimeout(x, ms); }); }

  async function probar(estado, conChecklist) {
    window.__estado = estado;
    const cont = document.getElementById('contenidoActividad');
    cont.textContent = '';
    await Actividad.abrir('ACT_1', 'CONTRATISTA');
    await esperar(250);
    const texto = cont.textContent || '';
    const error = texto.indexOf('No se pudo mostrar') >= 0;
    r.push((!error ? 'OK   ' : 'FALLA') + ' · ' + estado + ' abre sin error de pintado');
    r.push((texto.indexOf('Fumigación') >= 0 ? 'OK   ' : 'FALLA') + ' · ' + estado + ' pinta el título');
    r.push(((texto.indexOf('Checklist') >= 0) === conChecklist ? 'OK   ' : 'FALLA') + ' · ' + estado +
      (conChecklist ? ' pide el checklist' : ' aún no pide el checklist'));
  }

  try {
    await probar('PROGRAMADA', false);

    // El botón de etapas: con hitos dice «Reemplazar etapas» y debe abrir el editor
    window.__conHitos = true;
    document.getElementById('contenidoActividad').textContent = '';
    await Actividad.abrir('ACT_1', 'ADMIN');
    await esperar(250);
    const cont = document.getElementById('contenidoActividad');
    const botonEtapas = Array.prototype.slice.call(cont.querySelectorAll('button'))
      .filter(function (b) { return (b.textContent || '').indexOf('etapas') >= 0; })[0];
    r.push((botonEtapas ? 'OK   ' : 'FALLA') + ' · aparece el botón de etapas («' +
      (botonEtapas ? botonEtapas.textContent : 'ninguno') + '»)');
    if (botonEtapas) {
      botonEtapas.click();
      await esperar(200);
      const editor = document.querySelectorAll('.etapas').length;
      const guardar = Array.prototype.slice.call(cont.querySelectorAll('button'))
        .filter(function (b) { return (b.textContent || '') === 'Guardar etapas'; })[0];
      r.push((editor >= 1 ? 'OK   ' : 'FALLA') + ' · abre el editor (' + editor + ')');
      r.push((guardar ? 'OK   ' : 'FALLA') + ' · ofrece «Guardar etapas»');
      r.push((botonEtapas.textContent === 'Cerrar el editor' ? 'OK   ' : 'FALLA') +
        ' · el botón avisa que el editor está abierto («' + botonEtapas.textContent + '»)');
      botonEtapas.click();
      await esperar(120);
      r.push((document.querySelectorAll('.etapas').length === 0 ? 'OK   ' : 'FALLA') +
        ' · volver a pulsar lo cierra');
      r.push((botonEtapas.textContent === 'Reemplazar etapas' ? 'OK   ' : 'FALLA') +
        ' · y el botón vuelve a su texto');
    }
    // Reportar una etapa con foto opcional (v1.5)
    window.__conHitos = true;
    window.__estado = 'EN_EJECUCION';
    document.getElementById('contenidoActividad').textContent = '';
    await Actividad.abrir('ACT_1', 'CONTRATISTA');
    await esperar(250);
    const cont2 = document.getElementById('contenidoActividad');
    const btnEtapa = Array.prototype.slice.call(cont2.querySelectorAll('button'))
      .filter(function (b) { return b.textContent === 'Reportar esta etapa'; })[0];
    r.push((btnEtapa ? 'OK   ' : 'FALLA') + ' · cada etapa ofrece «Reportar esta etapa»');
    if (btnEtapa) {
      btnEtapa.click();
      await esperar(150);
      const form = document.getElementById('etapaForm');
      r.push((form ? 'OK   ' : 'FALLA') + ' · abre el formulario de la etapa');
      r.push((form && form.textContent.indexOf('Adjuntar una foto (opcional)') >= 0 ? 'OK   ' : 'FALLA') +
        ' · la foto es opcional y se puede adjuntar');
      const enviar = form && Array.prototype.slice.call(form.querySelectorAll('button'))
        .filter(function (b) { return b.textContent.indexOf('Enviar reporte de la etapa') >= 0; })[0];
      r.push((enviar ? 'OK   ' : 'FALLA') + ' · se puede enviar sin foto');
      if (enviar) {
        window.__llamadas = [];
        enviar.click();
        await esperar(400);
        const creado = window.__llamadas.filter(function (x) { return x.accion === 'reportes.crear'; })[0];
        r.push((creado && creado.payload.hito_id === 'HIT_1' ? 'OK   ' : 'FALLA') +
          ' · el reporte va con la etapa');
        const subida = window.__llamadas.filter(function (x) { return x.accion === 'evidencias.upload'; })[0];
        r.push((!subida ? 'OK   ' : 'FALLA') + ' · sin foto no se sube nada');
      }
    }
    window.__conHitos = false;
    await probar('EN_EJECUCION', true);
    await probar('RECHAZADA', true);
  } catch (e) {
    r.push('FALLA · excepción: ' + e.message);
  }
  if (window.__err.length) r.push('ERRORES: ' + window.__err.slice(0, 3).join(' / '));
  document.title = r.join(' | ');
})();
</script>
</body></html>
